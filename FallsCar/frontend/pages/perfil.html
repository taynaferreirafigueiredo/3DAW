<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Falls Cars - Perfil</title>
    <link rel="stylesheet" href="../css/perfil.css">
</head>

<body>

<header class="topbar">

    <div class="logo">Falls <span>Cars</span></div>

    <nav>
        <a href="home.html">Home</a>
        <a href="veiculos.html">Veículos</a>
        <a href="reserva.html">Reserva</a>
        <a href="perfil.html">Perfil</a>
    </nav>

    <button onclick="window.location.href='login.html'">Sair</button>

</header>


<section class="container">

    <div class="box">

        <h1>Meu Perfil</h1>
        <p>Gerencie suas informações pessoais</p>

        <form id="perfilForm">

            <label>Nome completo</label>
            <input type="text" id="nome" value="Usuário Demo">

            <label>E-mail</label>
            <input type="email" id="email" value="usuario@email.com">

            <label>Nova senha</label>
            <input type="password" id="senha" placeholder="Digite para alterar">

            <button type="submit">Salvar alterações</button>

        </form>

        <div class="info">

            <h3>Histórico rápido</h3>

            <div class="card">
                <p>🚗 SUV Premium</p>
                <span>R$ 300/dia - Finalizada</span>
            </div>

            <div class="card">
                <p>🚗 Hatch Econômico</p>
                <span>R$ 120/dia - Em andamento</span>
            </div>

        </div>

        <div id="msg"></div>

    </div>

</section>

<script src="../js/perfil.js"></script>

</body>
</html>
