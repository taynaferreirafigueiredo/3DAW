<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - FallsCar</title>

    <link rel="stylesheet" href="../css/pagamento.css">
</head>

<body>

    <div class="container">

        <h1>Pagamento</h1>

        <form id="formPagamento">

            <label>Nome no Cartão</label>
            <input type="text" id="nome" required>

            <label>Número do Cartão</label>
            <input type="text" id="cartao" maxlength="19" placeholder="0000 0000 0000 0000" required>

            <label>Validade</label>
            <input type="month" id="validade" required>

            <label>CVV</label>
            <input type="password" id="cvv" maxlength="3" required>

            <label>Valor Total</label>
            <input type="text" id="valor" value="R$ 0,00" readonly>

            <button type="submit">Finalizar Pagamento</button>

        </form>

    </div>

    <script src="../js/pagamento.js"></script>

</body>
</html>
